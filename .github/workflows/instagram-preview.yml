name: Instagram preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-preview.yml'
      - 'scripts/instagram_preview.py'
      - 'scripts/requirements-instagram.txt'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date in Europe/London (YYYY-MM-DD); blank means today'
        required: false
        type: string
  schedule:
    - cron: '30 8 * * *'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python3 -m pip install -r scripts/requirements-instagram.txt
      - name: Generate preview only
        env:
          PREVIEW_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$PREVIEW_DATE" ]; then
            python3 scripts/instagram_preview.py --date "$PREVIEW_DATE"
          else
            python3 scripts/instagram_preview.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: instagram-preview-${{ github.run_number }}
          path: instagram_previews/
          if-no-files-found: error
          retention-days: 14
